name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run backend regression suite
        # Coverage threshold matches current state at 2026-05-16 (measured 61%);
        # the 1-pt buffer (60) absorbs minor add/remove churn. Raise it as
        # coverage grows — never lower it.
        run: |
          pytest tests/unit tests/integration -q -m "not perf" \
            --cov=src --cov=backend --cov-report=xml --cov-report=term \
            --cov-fail-under=60

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          if-no-files-found: ignore
          path: coverage.xml

  lint:
    # Baseline-locked ruff gate. Mirrors the super-pricing sibling pattern:
    # we don't require zero findings, we require the count not to grow.
    # Tighten the floor by running `python scripts/check_ruff_baseline.py
    # --write-baseline` after intentional clean-up commits.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff annotations (visible inline in PR)
        # `|| true` keeps this advisory step from short-circuiting the gate;
        # the hard pass/fail decision is owned by the baseline check below.
        run: |
          ruff check src backend scripts tests --output-format=github || true

      - name: Ruff baseline gate (must pass)
        run: |
          python scripts/check_ruff_baseline.py

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Mypy on clean modules (must pass)
        run: |
          mypy --explicit-package-bases --namespace-packages --follow-imports=silent \
            src/analytics/technical_indicators.py \
            src/analytics/industry/ \
            src/backtest/__init__.py \
            src/backtest/base_backtester.py \
            src/backtest/batch_backtester.py \
            src/backtest/execution_engine.py \
            src/backtest/impact_model.py \
            src/backtest/metrics.py \
            src/backtest/portfolio_backtester.py \
            src/backtest/position_sizer.py \
            src/backtest/risk_manager.py \
            src/backtest/signal_adapter.py \
            src/data/etf_rotation.py \
            src/data/realtime_manager.py \
            src/data/data_manager.py \
            src/data/providers/provider_factory.py \
            src/research/policy_factor_attribution.py \
            src/strategy/etf_rotation_analytics.py \
            src/strategy/etf_rotation_service.py \
            src/trading/__init__.py \
            src/trading/trade_manager.py \
            src/trading/cross_market/__init__.py \
            src/trading/cross_market/cross_market_strategy.py \
            src/trading/cross_market/execution_router.py \
            src/trading/cross_market/hedge_portfolio.py \
            backend/app/services/industry_preferences.py \
            backend/app/services/paper_trading.py \
            backend/app/services/realtime_alerts.py \
            backend/app/services/realtime_journal.py \
            backend/app/services/runtime_state.py \
            backend/app/services/trade_stream.py \
            backend/app/services/backtest/__init__.py \
            backend/app/services/industry/__init__.py

      - name: Mypy broad probe (non-blocking)
        continue-on-error: true
        run: |
          mypy --explicit-package-bases --namespace-packages \
            backend/app/services src/analytics/technical_indicators.py \
            src/analytics/industry/ src/backtest/ src/trading/ || true

  perf:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run performance SLA suite
        run: |
          mkdir -p .benchmarks
          pytest -m perf --benchmark-only --benchmark-json=.benchmarks/result.json -v

      - name: Upload benchmark JSON
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-benchmarks
          if-no-files-found: ignore
          path: .benchmarks/result.json

  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps

      - name: Run frontend regression suite
        run: |
          CI=1 npm test -- --reporter=basic --pool=forks --poolOptions.forks.singleFork=true src/__tests__

      - name: Build frontend
        run: npm run build

  research-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            tests/e2e/package-lock.json

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Install research E2E dependencies
        working-directory: tests/e2e
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: tests/e2e
        run: npx playwright install --with-deps chromium

      - name: Start local application
        run: |
          mkdir -p logs
          ./scripts/start_system.sh --force-port-cleanup &
          echo $! > logs/start-system.pid
          for i in {1..120}; do
            curl -fsS http://localhost:3000 >/dev/null && curl -fsS http://localhost:8000/health >/dev/null && exit 0
            sleep 1
          done
          echo "Local application did not become ready in time"
          exit 1

      - name: Run research E2E suite
        working-directory: tests/e2e
        run: npm run verify:all

      - name: Stop local application
        if: always()
        run: ./scripts/stop_system.sh

      - name: Upload research E2E artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: research-e2e-artifacts
          if-no-files-found: ignore
          path: |
            output/playwright/**
            logs/**
