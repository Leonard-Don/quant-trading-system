# Static SPA server for the quant-trading-system frontend.
# The app calls the backend directly via its absolute VITE_API_URL, so this
# server only serves the built bundle (no API/ws proxying needed). Client-side
# routing uses ?view= query params, so every path falls back to index.html.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Long-cache the content-hashed Vite assets.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Don't cache the entrypoint so deploys take effect immediately.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
